[package]
name = "cubase-web-remote"
version = "0.1.0"
description = "Low-latency Web Remote Controller for Steinberg Cubase 15 Pro"
authors = ["CubaseWebRemote"]
edition = "2021"

[lib]
name = "cubase_web_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
midir = "0.10"
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
dirs = "5"
parking_lot = "0.12"
